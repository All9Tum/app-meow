<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="App Meow">
<title>App Meow (แอพเหมียว)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Prompt:wght@400;500;600&display=swap">
<style>
:root{--main:#3B6FD9;--deep:#2853AE;--tint:#E3ECFB;--ink:#2B211B;--muted:#7A6658;--soft:#5C4A3E;--bg:#FFF6EC;--line:#F3EAE0;--chip:#F6EEE5;--border:#E8DCCF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Prompt',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,.mitr{font-family:'Mitr','Prompt',sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px}
.top{padding:20px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1{margin:2px 0 0;font-size:24px;font-weight:600}
.sub{font-size:13px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:none;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink);text-decoration:none}
.iconbtn.dark{background:var(--ink);color:#fff}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cats{display:flex;justify-content:space-between;padding:16px 20px 0}
.cat{width:62px;border:none;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.dot{width:54px;height:54px;border-radius:27px;display:flex;align-items:center;justify-content:center;font-family:'Mitr',sans-serif;font-size:20px;font-weight:600;border:3px solid transparent;overflow:hidden;background-size:cover;background-position:center}
.cat .nm{font-size:12px;color:var(--muted)}
.cat[aria-pressed=true] .nm{color:var(--deep);font-weight:600}
.hero{margin:16px 20px 0;min-height:180px;border-radius:28px;position:relative;overflow:hidden;background:var(--tint)}
.hill{position:absolute;border-radius:50%;background:var(--main)}
.hero .in{position:relative;padding:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:180px}
.hero .name{font-family:'Mitr',sans-serif;font-size:32px;font-weight:600;line-height:1.1;color:var(--deep);overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;color:var(--deep);text-decoration:none;border:none}
.photo{width:118px;height:118px;flex-shrink:0;border-radius:59px;background:#fff center/cover no-repeat;border:4px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);box-shadow:0 6px 18px rgba(43,33,27,.10);font-size:11px;padding:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 20px 0}
.stat{background:#fff;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .l{font-size:11px;color:var(--muted)}
.stat .v{font-family:'Mitr',sans-serif;font-size:18px;font-weight:600;color:var(--deep);overflow-wrap:anywhere}
.stat .v.sm{font-size:15px;font-weight:500;color:var(--ink)}
.card{margin:14px 20px 0;background:#fff;border-radius:24px;padding:16px}
.card h2{margin:0;font-size:17px;font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.link{font-size:13px;font-weight:500;color:var(--deep);text-decoration:none;background:none;border:none;padding:8px 0}
.empty{border-radius:16px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:4px;background:var(--tint)}
.empty b{font-weight:500;color:var(--deep);font-size:14px}
.empty span{font-size:12px;color:var(--soft)}
.fab{position:fixed;bottom:98px;width:60px;height:60px;border-radius:30px;border:none;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--deep);box-shadow:0 8px 20px rgba(43,33,27,.22);right:max(24px,calc(50% - 216px));z-index:5}
.fab svg{width:26px;height:26px;stroke-width:2.4}
nav.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:calc(80px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-radius:24px 24px 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;box-shadow:0 -4px 16px rgba(43,33,27,.06);z-index:4}
nav.bar button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);height:64px;justify-content:center}
nav.bar button.on{color:var(--deep);font-weight:600}
nav.bar svg{width:22px;height:22px}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:none}
.kv{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);flex-shrink:0}
.kv .v{font-weight:500;text-align:right;overflow-wrap:anywhere;white-space:pre-line}
.ph{color:#B09A88;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;border:2px solid var(--border);background:#fff;color:var(--muted)}
.chip i{width:10px;height:10px;border-radius:5px;display:block}
.sheet{position:relative;margin-top:64px;background:#fff;border-radius:32px 32px 0 0;padding:22px 20px 30px;min-height:calc(100vh - 64px);display:flex;flex-direction:column;gap:18px}
.band{position:absolute;left:0;right:0;top:0;height:150px;overflow:hidden;background:var(--tint)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.inp{height:48px;border-radius:14px;border:1.5px solid var(--border);padding:0 14px;font-size:15px;background:#fff;color:var(--ink);width:100%}
textarea.inp{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.inp:focus{outline:2px solid var(--main);border-color:transparent}
.big{border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--tint)}
.big input{width:220px;border:none;background:transparent;text-align:center;font-family:'Mitr',sans-serif;font-size:48px;font-weight:600;color:var(--deep);outline:none}
.btn{height:56px;border-radius:28px;border:none;color:#fff;font-size:16px;font-weight:600;background:var(--deep);width:100%}
.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--deep)}
.btn:disabled{opacity:.55}
.idcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.idc{aspect-ratio:1.586;border-radius:14px;border:2px dashed #C9D6F2;background:#F7F9FE center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--deep);font-size:13px;padding:0;position:relative;overflow:hidden;border-color:var(--main)}
.idc.has{border-style:solid;border-color:transparent}
.idc .tag{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.92);border-radius:999px;padding:2px 8px;font-size:11px;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:50;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.viewer{position:fixed;inset:0;background:rgba(20,14,10,.92);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.viewer img{max-width:100%;max-height:75vh;border-radius:12px}
.viewer .acts{display:flex;gap:10px}
.viewer .acts button{height:48px;padding:0 20px;border-radius:24px;border:none;font-weight:600}
.spin{width:22px;height:22px;border:3px solid var(--tint);border-top-color:var(--deep);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{margin:16px 20px 0;background:#F1E6DA;border-radius:999px;padding:4px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.del{border:none;background:none;color:#B52F2F;font-size:12px;font-weight:600;padding:8px 4px}
.del.sure{background:#B52F2F;color:#fff;border-radius:999px;padding:6px 12px}
.soon{margin:40px 20px 0;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.soon .ic{width:84px;height:84px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--deep)}
.soon .ic svg{width:40px;height:40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== icons ===== */
const IC = {
  home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  heart:'<path d="M12 20s-7-4.4-9.2-8.6A4.8 4.8 0 0 1 12 6.3a4.8 4.8 0 0 1 9.2 5.1C19 15.6 12 20 12 20z"/>',
  wallet:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  cam:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  sync:'<path d="M21 12a9 9 0 0 1-15.5 6.2L3 16M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/>'
};
const icon = (n, cls='i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ===== storage ===== */
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ===== state ===== */
const S = {
  cfg: LS.get('pt_cfg', {}),
  data: LS.get('pt_data', null),
  cur: LS.get('pt_cur', 0),
  view: 'home',
  hidden: {},
  busy: false,
  photos: {},           // file_id -> dataUrl (หน่วยความจำ)
  thumbs: LS.get('pt_thumbs', {}), // file_id -> thumbnail dataUrl (เก็บในเครื่อง)
  delSure: null,
  viewer: null
};

/* ===== utils ===== */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THD = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
function fmtDate(s){ if(!s) return ''; const p = String(s).split('-'); if(p.length<3) return s; return +p[2] + ' ' + TH[+p[1]-1] + ' ' + p[0]; }
function today(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function age(b){
  if(!b) return null;
  const [y,m,d] = b.split('-').map(Number); const n = new Date();
  let mo = (n.getFullYear()-y)*12 + (n.getMonth()+1-m); if(n.getDate() < d) mo--;
  if(mo < 0) return null;
  const yy = Math.floor(mo/12), mm = mo%12;
  return yy ? (yy+' ปี' + (mm ? ' '+mm+' ด.' : '')) : (mm + ' เดือน');
}
function toast(msg){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}
function pets(){ return (S.data && S.data.pets || []).slice().sort((a,b)=>a.sort-b.sort); }
function cur(){ const p = pets(); if(S.cur >= p.length) S.cur = 0; return p[S.cur]; }
function weightsOf(id){ return (S.data.weights||[]).filter(w=>w.pet_id===id).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:(a.created_at<b.created_at?-1:1)); }
function applyTheme(){
  const p = cur(); if(!p) return;
  const r = document.documentElement.style;
  r.setProperty('--main', p.color_main); r.setProperty('--deep', p.color_deep); r.setProperty('--tint', p.color_tint);
}

/* ===== API ===== */
async function api(action, payload){
  if (S.cfg.demo) return demoApi(action, payload);
  const res = await fetch(S.cfg.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ key:S.cfg.key, action, payload }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j.data;
}

/* ----- demo (ข้อมูลอยู่ในเครื่องนี้เท่านั้น) ----- */
const DEMO_SEED = (()=>{
  const P = [['P01','Satang','#3B6FD9','#2853AE','#E3ECFB','Satang Stories'],['P02','Mali','#EC6FA6','#B83A76','#FCE4EF','Mali Rhyme'],['P03','Elize','#E04B4B','#B52F2F','#FBE3E1','Elize Tales'],['P04','Magnum','#4CC46A','#1F7A3A','#E0F5E5','Magnum Saga'],['P05','Sephera','#F28C28','#A8530A','#FDEBD7','']];
  const pets = P.map((p,i)=>({pet_id:p[0],name:p[1],color_main:p[2],color_deep:p[3],color_tint:p[4],hashtag:p[5],birthday:'',adopted_on:'',breed:'',coat:'',sex:'',neutered:'',microchip:'',photo_id:'',card_front_id:'',card_back_id:'',owner_name:'',owner_address:'',card_issued_on:'',sort:i+1}));
  const W = [['2021-10-01',5.2,0,0,0],['2022-04-01',5.15,2.1,0,0],['2022-10-01',5.5,2.95,0,0],['2023-04-28',5.5,3.8,0,0],['2023-08-10',5.7,3.8,1.1,0],['2023-11-10',5.9,3.8,2.5,0],['2024-10-12',6,3.8,2.5,0],['2025-05-02',6,3.8,2.3,3],['2025-11-23',6,3.8,4.2,4.7],['2026-08-30',5.7,3.7,3.9,6.1]];
  const weights = []; let n=0;
  W.forEach(r=>{ for(let k=1;k<=4;k++) if(r[k]>0) weights.push({weight_id:'D'+(++n),pet_id:P[k-1][0],date:r[0],kg:r[k],note:'',created_at:''}); });
  return {pets, weights};
})();
function demoApi(action, p){
  const d = LS.get('pt_demo', null) || JSON.parse(JSON.stringify(DEMO_SEED));
  const save = ()=> LS.set('pt_demo', d);
  return new Promise(res=>setTimeout(()=>{
    if(action==='getAll') return res(d);
    if(action==='addWeight'){ const w={weight_id:'D'+Date.now(),pet_id:p.pet_id,date:p.date,kg:Math.round(+p.kg*100)/100,note:p.note||'',created_at:new Date().toISOString()}; d.weights.push(w); save(); return res(w); }
    if(action==='deleteWeight'){ d.weights = d.weights.filter(w=>w.weight_id!==p.weight_id); save(); return res(p); }
    if(action==='savePet'){ const x = d.pets.find(q=>q.pet_id===p.pet_id); Object.assign(x,p); save(); return res(x); }
    if(action==='uploadPhoto'){ const x = d.pets.find(q=>q.pet_id===p.pet_id); const id='demo_'+p.kind+'_'+Date.now(); x[{photo:'photo_id',card_front:'card_front_id',card_back:'card_back_id'}[p.kind]]=id; const ph=LS.get('pt_demo_ph',{}); ph[id]=p.dataUrl; LS.set('pt_demo_ph',ph); save(); return res(x); }
    if(action==='getPhoto'){ return res({file_id:p.file_id,dataUrl:(LS.get('pt_demo_ph',{}))[p.file_id]||''}); }
    res(null);
  }, 150));
}

async function load(quiet){
  try {
    const d = await api('getAll');
    S.data = d; LS.set('pt_data', d);
    render();
    loadThumbs();
  } catch(e){
    if(!quiet) toast('โหลดข้อมูลไม่ได้: ' + e.message);
    if(!S.data) render();
  }
}

/* ===== photos ===== */
function resizeImage(file, max, q){
  return new Promise((res, rej)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const s = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('อ่านรูปไม่ได้')); };
    img.src = url;
  });
}
function thumbFrom(dataUrl){
  return new Promise(res=>{
    const img = new Image();
    img.onload = ()=>{ const s = 240/Math.max(img.width,img.height); const c=document.createElement('canvas'); c.width=Math.round(img.width*Math.min(1,s)); c.height=Math.round(img.height*Math.min(1,s)); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.8)); };
    img.onerror = ()=>res('');
    img.src = dataUrl;
  });
}
async function getPhoto(id){
  if(!id) return '';
  if(S.photos[id]) return S.photos[id];
  const r = await api('getPhoto', {file_id:id});
  S.photos[id] = r.dataUrl; return r.dataUrl;
}
async function loadThumbs(){
  const ids = [];
  pets().forEach(p=>['photo_id','card_front_id','card_back_id'].forEach(k=>{ if(p[k] && !S.thumbs[p[k]]) ids.push(p[k]); }));
  for(const id of ids){
    try { const full = await getPhoto(id); const t = await thumbFrom(full); if(t){ S.thumbs[id]=t; } } catch(e){}
  }
  // ล้าง thumbnail ที่ไม่ใช้แล้ว
  const used = new Set(); pets().forEach(p=>['photo_id','card_front_id','card_back_id'].forEach(k=>p[k]&&used.add(p[k])));
  Object.keys(S.thumbs).forEach(k=>{ if(!used.has(k)) delete S.thumbs[k]; });
  LS.set('pt_thumbs', S.thumbs);
  if(ids.length) render();
}
function pickPhoto(kind){
  const p = cur();
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange = async ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    try {
      S.busy = true; render(); toast('กำลังอัปโหลดรูป…');
      const dataUrl = await resizeImage(f, kind==='photo' ? 900 : 1600, 0.85);
      const row = await api('uploadPhoto', {pet_id:p.pet_id, kind, dataUrl});
      const id = row[{photo:'photo_id',card_front:'card_front_id',card_back:'card_back_id'}[kind]];
      S.photos[id] = dataUrl; S.thumbs[id] = await thumbFrom(dataUrl); LS.set('pt_thumbs', S.thumbs);

async function openViewer(kind){
  const p = cur(); const id = p[{photo:'photo_id',card_front:'card_front_id',card_back:'card_back_id'}[kind]];
  if(!id) return pickPhoto(kind);
  S.viewer = {kind, src: S.thumbs[id] || '', loading:true}; render();

}

/* ===== charts ===== */
function miniChart(ws){
  const W=318,H=112; if(!ws.length) return '';
  const xs = ws.map(w=>Date.parse(w.date)), vs = ws.map(w=>w.kg);
  let x0=Math.min(...xs), x1=Math.max(...xs); if(x1===x0) x1=x0+1;
  const mn=Math.min(...vs), mx=Math.max(...vs), lo=mn-0.2, hi=mx+0.2;
  const px=x=>34+(x-x0)/(x1-x0)*276, py=v=>14+(hi-v)/(hi-lo)*74;
  const pts = ws.map((w,k)=>px(xs[k]).toFixed(1)+' '+py(vs[k]).toFixed(1));
  const line='M'+pts.join(' L'), area=line+` L${px(x1).toFixed(1)} 92 L${px(x0).toFixed(1)} 92 Z`;
  const last=ws[ws.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟน้ำหนัก จาก ${vs[0].toFixed(2)} ถึง ${last.kg.toFixed(2)} กิโลกรัม" style="display:block">
    <line x1="30" y1="10" x2="314" y2="10" stroke="#F1E6DA"/><line x1="30" y1="92" x2="314" y2="92" stroke="#F1E6DA"/>
    <path d="${area}" fill="var(--tint)"/>
    <path d="${line}" fill="none" stroke="var(--main)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${px(xs[xs.length-1])}" cy="${py(last.kg)}" r="5" fill="#fff" stroke="var(--deep)" stroke-width="3"/>
    <text x="0" y="14" font-size="10" fill="#7A6658">${mx.toFixed(1)}</text>
    <text x="0" y="96" font-size="10" fill="#7A6658">${mn.toFixed(1)}</text>
    <text x="30" y="108" font-size="10" fill="#7A6658">${fmtDate(ws[0].date)}</text>
    <text x="314" y="108" font-size="10" fill="#7A6658" text-anchor="end">${fmtDate(last.date)}</text></svg>`;
}
function bigChart(){
  const all = S.data.weights.filter(w=>!S.hidden[w.pet_id]);
  const W=318,H=230;
  const allW = S.data.weights; if(!allW.length) return '<div class="empty" style="margin-top:12px"><b>ยังไม่มีข้อมูลน้ำหนัก</b></div>';
  const ts = allW.map(w=>Date.parse(w.date));
  const x0 = Math.min(...ts) - 20*864e5, x1 = Math.max(...ts, Date.now()) + 20*864e5;
  const top = Math.ceil(Math.max(...allW.map(w=>w.kg), 1)) + 1;
  const px=t=>30+(t-x0)/(x1-x0)*280, py=v=>10+(top-v)/top*196;
  let g='';
  for(let v=0; v<=top; v+= top>8?2:1){ if(v%2 && top>4) continue; g+=`<line x1="26" y1="${py(v)}" x2="314" y2="${py(v)}" stroke="#F1E6DA"/><text x="0" y="${py(v)+3}" font-size="10" fill="#7A6658">${v} กก.</text>`; }
  const y0 = new Date(x0).getFullYear()+1, y1 = new Date(x1).getFullYear();
  const step = y1-y0 > 6 ? 2 : 1;
  for(let y=y0;y<=y1;y+=step){ g+=`<text x="${px(Date.parse(y+'-01-01'))}" y="226" font-size="10" fill="#7A6658" text-anchor="middle">${y}</text>`; }
  pets().forEach(p=>{
    if(S.hidden[p.pet_id]) return;
    const ws = weightsOf(p.pet_id); if(!ws.length) return;
    const d = 'M'+ws.map(w=>px(Date.parse(w.date)).toFixed(1)+' '+py(w.kg).toFixed(1)).join(' L');
    const l = ws[ws.length-1];
    g+=`<path d="${d}" fill="none" stroke="${p.color_main}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${px(Date.parse(l.date))}" cy="${py(l.kg)}" r="4.5" fill="#fff" stroke="${p.color_deep}" stroke-width="2.5"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟน้ำหนักของน้องทุกตัว" style="display:block;margin-top:12px">${g}</svg>`;
}

  <div class="card">${S.cfg.demo?'<b>โหมดทดลอง</b><p class="sub">ข้อมูลอยู่ในเครื่องนี้เท่านั้น ไม่ได้บันทึกลง Google Sheet</p>':`<div class="sub">เชื่อมต่อกับ</div><div style="font-size:12px;word-break:break-all;margin-top:4px">${esc(S.cfg.url)}</div>`}</div>
  <div style="margin:14px 20px 0;display:flex;flex-direction:column;gap:10px">
    <button class="btn ghost" data-act="refresh">${S.busy?'กำลังโหลด…':'ดึงข้อมูลล่าสุดจากชีต'}</button>
    <button class="btn ghost" data-act="logout" style="color:#B52F2F;border-color:#B52F2F">ยกเลิกการเชื่อมต่อในเครื่องนี้</button>
  </div>`;
}

function vSetup(){
  return `<div style="padding:40px 24px;display:flex;flex-direction:column;gap:18px">
    <div style="width:72px;height:72px;border-radius:24px;background:#E3ECFB;display:flex;align-items:center;justify-content:center;color:#2853AE">${icon('heart').replace('class="i"','class="i" style="width:36px;height:36px"')}</div>
    <h1 style="margin:0;font-size:28px;font-weight:600">App Meow</h1><div class="sub" style="margin-top:-12px">แอพเหมียว</div>
    <p class="sub" style="margin:0;line-height:1.6">เชื่อมกับ Google Sheet ของตาตั้ม ใส่ Web app URL และ API KEY จาก Apps Script หรือเปิดจากลิงก์ตั้งค่าที่ซีซาร์ส่งให้</p>
    <form data-form="setup" style="display:flex;flex-direction:column;gap:14px" novalidate>
      <label class="f">Web app URL<input class="inp" name="url" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(S.cfg.url||'')}"></label>
      <label class="f">API KEY<input class="inp" name="key" type="text" autocomplete="off" value="${esc(S.cfg.key||'')}"></label>
      <button class="btn" type="submit" style="background:#2853AE">เชื่อมต่อ</button>
    </form>
    <button class="btn ghost" data-act="demo" style="color:#2853AE;border-color:#2853AE">ลองโหมดทดลองก่อน</button>
  </div>`;
}

function vViewer(){
  const v = S.viewer; const label = {photo:'รูปน้อง',card_front:'หน้าบัตร',card_back:'หลังบัตร'}[v.kind];
  return `<div class="viewer" role="dialog" aria-modal="true" aria-label="${label}">
    ${v.src?`<img src="${v.src}" alt="${label} ${esc(cur().name)}">`:'<div class="spin"></div>'}
    ${v.loading?'<div style="color:#fff;font-size:13px">กำลังโหลดรูปเต็ม…</div>':''}
    <div class="acts"><button data-act="replace" data-k="${v.kind}" style="background:#fff;color:var(--ink)">เปลี่ยนรูป</button><button data-act="closeViewer" style="background:var(--deep);color:#fff">ปิด</button></div></div>`;
}

function render(){
  const app = document.getElementById('app');
  if(!S.cfg.url && !S.cfg.demo){ app.innerHTML = vSetup(); return; }
  if(!S.data){ app.innerHTML = `<div style="padding:120px 20px;text-align:center"><div class="spin"></div><p class="sub">กำลังโหลดข้อมูลน้องๆ…</p></div>`; return; }
  applyTheme();
  const V = {home:vHome, weights:vWeights, add:vAdd, profile:vProfile, edit:vEdit, settings:vSettings, care:vSoon, health:vSoon, money:vSoon}[S.view] || vHome;
  const focusKg = S.view==='add' ? (document.activeElement && document.activeElement.name==='kg') : false;
  const keep = {}; if(S.view==='add'){ const f=document.querySelector('form[data-form=weight]'); if(f){ ['kg','date','note'].forEach(n=>keep[n]=f.elements[n].value); } }
  app.innerHTML = V() + (['add','edit'].includes(S.view)?'':navBar()) + (S.viewer?vViewer():'');
  if(S.view==='add'){ const f=document.querySelector('form[data-form=weight]'); Object.keys(keep).forEach(n=>{ if(keep[n]!=null) f.elements[n].value=keep[n]; }); if(focusKg) f.elements.kg.focus(); }
}

/* ===== events ===== */
document.addEventListener('click', async e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a==='pick'){ S.cur = +b.dataset.i; LS.set('pt_cur', S.cur); S.delSure=null; render(); }
  else if(a==='go'){ S.view = b.dataset.v; S.delSure=null; render(); window.scrollTo(0,0); if(S.view==='add') setTimeout(()=>{const k=document.getElementById('kg'); k&&k.focus();},50); }
  else if(a==='toggle'){ S.hidden[b.dataset.id] = !S.hidden[b.dataset.id]; render(); }
  else if(a==='photo'){ openViewer(b.dataset.k); }
  else if(a==='replace'){ pickPhoto(b.dataset.k); }
  else if(a==='closeViewer'){ S.viewer=null; render(); }
  else if(a==='del'){
    const id = b.dataset.id;
    if(S.delSure!==id){ S.delSure=id; render(); return; }
    try { await api('deleteWeight',{weight_id:id}); S.data.weights = S.data.weights.filter(w=>w.weight_id!==id); LS.set('pt_data',S.data); toast('ลบแล้ว'); }
    catch(err){ toast('ลบไม่สำเร็จ: '+err.message); }
    S.delSure=null; render();
  }
  else if(a==='refresh'){ S.busy=true; render(); await load(); S.busy=false; render(); toast('อัปเดตแล้ว'); }
  else if(a==='logout'){ S.cfg={}; S.data=null; LS.set('pt_cfg',{}); LS.set('pt_data',null); S.view='home'; render(); }
  else if(a==='demo'){ S.cfg={demo:true}; LS.set('pt_cfg',S.cfg); S.data=null; render(); load(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.viewer){ S.viewer=null; render(); } });
document.addEventListener('submit', async e=>{
  const f = e.target; e.preventDefault();
  const kind = f.dataset.form;
  if(kind==='setup'){
    const url = f.elements.url.value.trim(), key = f.elements.key.value.trim();
    if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){ toast('URL ต้องเป็นลิงก์ Apps Script ที่ลงท้ายด้วย /exec'); return; }
    if(!key){ toast('ใส่ API KEY ด้วย'); return; }
    S.cfg={url,key}; LS.set('pt_cfg',S.cfg); S.data=null; render(); load();
  }
  if(kind==='weight'){
    const p = cur();
    const kg = parseFloat(String(f.elements.kg.value).replace(',','.'));
    const date = f.elements.date.value;
    if(!(kg>0 && kg<30)){ toast('ใส่น้ำหนักเป็นกิโลกรัม เช่น 4.25'); f.elements.kg.focus(); return; }
    if(!date){ toast('เลือกวันที่ด้วย'); return; }
    S.busy=true; render();
    try {
      const w = await api('addWeight',{pet_id:p.pet_id, kg, date, note:f.elements.note.value.trim()});
      S.data.weights.push(w); LS.set('pt_data',S.data);
      S.busy=false; S.view='home'; render(); toast(`บันทึก ${p.name} ${kg.toFixed(2)} กก. แล้ว`);
    } catch(err){ S.busy=false; render(); toast('บันทึกไม่สำเร็จ: '+err.message); }
  }
  if(kind==='pet'){
    const p = cur(); const o = {pet_id:p.pet_id};
    ['name','hashtag','birthday','adopted_on','breed','coat','sex','neutered','microchip','owner_name','owner_address','card_issued_on'].forEach(n=>o[n]=f.elements[n].value.trim());
    o.hashtag = o.hashtag.replace(/^#/, '');
    if(!o.name){ toast('ต้องมีชื่อน้อง'); return; }
    S.busy=true; render();
    try { const row = await api('savePet', o); Object.assign(p, row); LS.set('pt_data',S.data); S.busy=false; S.view='profile'; render(); toast('บันทึกโปรไฟล์แล้ว'); }
    catch(err){ S.busy=false; render(); toast('บันทึกไม่สำเร็จ: '+err.message); }
  }
});

/* ลิงก์ตั้งค่า: #setup=<base64url ของ {"u":url,"k":key}> */
(function(){
  const m = location.hash.match(/^#setup=(.+)$/); if(!m) return;
  try {
    const s = m[1].replace(/-/g,'+').replace(/_/g,'/');
    const o = JSON.parse(decodeURIComponent(escape(atob(s))));
    if(o.u && /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(o.u)){ S.cfg={url:o.u,key:o.k||''}; LS.set('pt_cfg',S.cfg); S.data=null; LS.set('pt_data',null); }
  } catch(e){}
  history.replaceState(null,'',location.pathname+location.search);
})();

render();
if(S.cfg.url || S.cfg.demo){ load(!!S.data); loadThumbs(); }
</script>
</body>
</html>
